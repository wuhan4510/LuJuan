<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卢娟拼图</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            margin: 0; min-height: 100vh;
            background: linear-gradient(145deg, #1a2639 0%, #2a3b4f 100%);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif; padding: 8px;
        }
        .app-container {
            background: rgba(22, 30, 40, 0.8); backdrop-filter: blur(10px);
            border-radius: 32px; padding: 16px 14px 20px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.6), inset 0 1px 4px rgba(255,255,255,0.15);
            max-width: 420px; width: 100%; border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }
        .title {
            text-align: center; font-weight: 600; font-size: 26px;
            letter-spacing: 3px; color: #eef4ff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            margin: 0 0 10px 0;
        }
        /* 竖版画布 3:4 */
        .canvas-wrapper {
            position: relative; width: 100%; aspect-ratio: 3 / 4;
            margin: 6px 0 12px; border-radius: 24px; overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 18px 25px -8px black;
            touch-action: none;
        }
        canvas {
            display: block; width: 100% !important; height: 100% !important;
            background: #10171f; cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas:active { cursor: grabbing; }

        /* 顶部右侧：极小重新扫描按钮 */
        .reload-mini {
            position: absolute; top: 22px; right: 22px;
            width: 32px; height: 32px;
            background: rgba(59, 110, 165, 0.85);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; color: #fff;
            cursor: pointer; z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: all 0.15s ease;
            padding: 0;
            line-height: 1;
        }
        .reload-mini:active {
            transform: scale(0.9);
            background: rgba(59, 110, 165, 1);
        }

        .toolbar {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 12px; margin: 12px 0 8px;
        }
        .btn {
            background: #252f3a; border: none; border-radius: 60px;
            padding: 14px 28px; font-weight: 600; font-size: 17px;
            color: #e6edf7;
            box-shadow: 0 8px 0 #0b1015, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.06s ease;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; cursor: pointer; flex: 1 0 auto;
            border: 1px solid rgba(255,255,255,0.06); letter-spacing: 0.5px;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #0b1015, 0 8px 16px rgba(0,0,0,0.4);
        }
        .btn-primary {
            background: #3b6ea5;
            box-shadow: 0 8px 0 #1d3550, 0 10px 20px rgba(0,0,0,0.3);
            color: white;
        }
        .btn-primary:active {
            box-shadow: 0 3px 0 #1d3550, 0 8px 16px rgba(0,0,0,0.4);
        }
        .file-input { display: none; }
        .status {
            text-align: center; font-size: 15px; font-weight: 500;
            color: #a1b7d4; margin-top: 10px; letter-spacing: 0.5px;
            min-height: 22px; transition: color 0.2s; line-height: 1.4;
        }
        .win-effect {
            color: #7ff0b2; text-shadow: 0 0 10px #1e8a5c; font-weight: 700;
        }
        .folder-hint {
            font-size: 11px; color: #5b6e85; text-align: center;
            margin-top: 4px; word-break: break-all;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-box {
            background: linear-gradient(145deg, #1e2e3e, #16212b);
            border-radius: 40px; padding: 32px 28px 28px;
            max-width: 320px; width: 85%; text-align: center;
            box-shadow: 0 35px 50px rgba(0, 0, 0, 0.7), inset 0 1px 3px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-emoji {
            font-size: 64px; line-height: 1; margin-bottom: 12px;
            display: block; filter: drop-shadow(0 0 16px #7ff0b2);
        }
        .modal-title {
            font-size: 28px; font-weight: 700; color: #eef4ff;
            letter-spacing: 1px; margin: 0 0 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .modal-desc {
            font-size: 16px; color: #9bb5d4; margin: 0 0 24px; line-height: 1.5;
        }
        .modal-btn {
            background: #3b6ea5; border: none; border-radius: 60px;
            padding: 14px 24px; font-weight: 600; font-size: 18px; color: #fff;
            box-shadow: 0 8px 0 #1d3550, 0 10px 20px rgba(0,0,0,0.4);
            transition: all 0.06s ease; cursor: pointer; width: 100%;
            letter-spacing: 0.5px; border: 1px solid rgba(255,255,255,0.15);
        }
        .modal-btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #1d3550, 0 8px 16px rgba(0,0,0,0.4);
        }
        .modal-btn.secondary {
            background: #2a3a4a;
            box-shadow: 0 8px 0 #111a22, 0 10px 20px rgba(0,0,0,0.3);
            margin-top: 10px; font-size: 16px; padding: 12px 20px;
        }
        .modal-btn.secondary:active {
            box-shadow: 0 3px 0 #111a22, 0 8px 16px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="title">卢娟拼图</div>

    <!-- 极小重新扫描按钮（右上角悬浮） -->
    <button class="reload-mini" id="reloadBtn" title="重新扫描">🔄</button>

    <div class="canvas-wrapper">
        <canvas id="puzzleCanvas" width="450" height="600"></canvas>
    </div>

    <div class="toolbar">
        <button class="btn btn-primary" id="shuffleBtn" title="打乱当前拼图">🔀 重新打乱</button>
    </div>
    <input type="file" id="fileInput" class="file-input" accept="image/*">

    <div class="status" id="statusMsg">正在加载 image01.jpg...</div>
    <div class="folder-hint" id="folderHint"></div>
</div>

<div class="modal-overlay" id="winModal">
    <div class="modal-box">
        <span class="modal-emoji">🎉</span>
        <h2 class="modal-title">恭喜完成！</h2>
        <p class="modal-desc" id="modalDesc">你成功拼好了这幅拼图！</p>
        <button class="modal-btn" id="nextImageBtn">下一张图片</button>
        <button class="modal-btn secondary" id="modalCloseBtn">继续挑战</button>
    </div>
</div>

<script>
    (function(){
        // ============================================================
        //  核心配置
        // ============================================================
        const BASE_URL = 'https://wuhan4510.github.io/LuJuan/';
        const FILE_PREFIX = 'image';
        const FILE_EXT = '.jpg';
        const START_NUM = 1;
        const END_NUM = 99;
        const NUM_PAD = 2;
        // ============================================================

        const canvas = document.getElementById('puzzleCanvas');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('statusMsg');
        const folderHint = document.getElementById('folderHint');
        const fileInput = document.getElementById('fileInput');
        const reloadBtn = document.getElementById('reloadBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');

        const winModal = document.getElementById('winModal');
        const modalDesc = document.getElementById('modalDesc');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const nextImageBtn = document.getElementById('nextImageBtn');

        // 竖版：3 列 x 4 行
        const COLS = 3;
        const ROWS = 4;
        const TILE_COUNT = COLS * ROWS;

        let tiles = [];
        let imageLoaded = false;
        let customImage = null;

        let imageList = [];
        let currentImageIndex = -1;

        // 拖拽状态
        let isDragging = false;
        let dragSourceIndex = -1;
        let dragCurrentX = 0, dragCurrentY = 0;
        let dragStartX = 0, dragStartY = 0;
        let dragOffsetX = 0, dragOffsetY = 0;
        let dragMoved = false;

        let winModalShown = false;

        // 画布尺寸：竖版 3:4（450 x 600）
        const CANVAS_W = 450;
        const CANVAS_H = 600;
        const TILE_W = CANVAS_W / COLS;
        const TILE_H = CANVAS_H / ROWS;

        const DEFAULT_TILE_COLORS = [
            '#2e4b6e', '#3b6ea5', '#5a8ec9', '#7eaaed', '#a8c4f0',
            '#1e3a5f', '#2a4b7a', '#4a6f9e', '#6e94c4', '#8fb4e8',
            '#1a3550', '#2d4a6b'
        ];

        // ---------- 生成文件名 ----------
        function buildFileName(num) {
            return FILE_PREFIX + String(num).padStart(NUM_PAD, '0') + FILE_EXT;
        }

        function buildFileUrl(num) {
            return BASE_URL + buildFileName(num);
        }

        // ---------- 打乱 ----------
        function generateShuffledTiles() {
            const arr = Array.from({ length: TILE_COUNT }, (_, i) => i);
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let attempts = 0;
            while (isSolvedArray(arr) && attempts < 30) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                attempts++;
            }
            if (isSolvedArray(arr)) [arr[0], arr[1]] = [arr[1], arr[0]];
            return arr;
        }

        function isSolvedArray(arr) {
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== i) return false;
            }
            return true;
        }

        // ---------- 加载图片 ----------
        function loadImageFromUrl(url, indexInfo) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    customImage = img;
                    imageLoaded = true;
                    tiles = generateShuffledTiles();
                    winModalShown = false;
                    drawPuzzle();
                    statusMsg.textContent = `已加载 ${indexInfo || ''}，自动打乱`;
                    statusMsg.classList.remove('win-effect');
                    resolve(img);
                };
                img.onerror = (e) => {
                    console.error('加载失败:', url, e);
                    reject(new Error('图片加载失败: ' + url));
                };
                img.src = url;
            });
        }

        function initDefaultTiles() {
            tiles = Array.from({ length: TILE_COUNT }, (_, i) => i);
            imageLoaded = false;
            customImage = null;
            winModalShown = false;
            drawPuzzle();
            statusMsg.textContent = '加载中...';
            statusMsg.classList.remove('win-effect');
        }

        // ---------- 扫描网络图片 ----------
        async function scanRemoteImages() {
            folderHint.textContent = `正在探测 ${BASE_URL} ...`;
            statusMsg.textContent = `正在探测 image01 ~ image${END_NUM}...`;

            const candidates = [];
            for (let i = START_NUM; i <= END_NUM; i++) {
                candidates.push({ num: i, url: buildFileUrl(i), name: buildFileName(i) });
            }

            const foundImages = [];

            const concurrency = 8;
            let idx = 0;
            async function worker() {
                while (idx < candidates.length) {
                    const item = candidates[idx++];
                    const exists = await testImageExists(item.url);
                    if (exists) {
                        foundImages.push(item);
                        folderHint.textContent = `已发现 ${foundImages.length} 张图片...`;
                    }
                }
            }
            const workers = [];
            for (let w = 0; w < concurrency; w++) workers.push(worker());
            await Promise.all(workers);

            foundImages.sort((a, b) => a.num - b.num);

            if (foundImages.length === 0) {
                folderHint.textContent = `未在 ${BASE_URL} 找到 ${FILE_PREFIX}XX${FILE_EXT}`;
                statusMsg.textContent = '未找到图片，请检查 BASE_URL 和文件名规则';
                const testImg = new Image();
                testImg.crossOrigin = 'Anonymous';
                testImg.onload = () => console.log('理论上 image01.jpg 可以加载');
                testImg.onerror = () => console.error('image01.jpg 加载失败');
                testImg.src = buildFileUrl(START_NUM);
                if (!imageLoaded) initDefaultTiles();
                return;
            }

            imageList = foundImages;
            currentImageIndex = 0;
            const total = imageList.length;
            folderHint.textContent = `📁 发现 ${total} 张图片 · 当前第1张（${imageList[0].name}）`;

            try {
                await loadImageFromUrl(imageList[0].url, `(1/${total})`);
                statusMsg.textContent = `已加载 1/${total}：${imageList[0].name}`;
            } catch (e) {
                statusMsg.textContent = '图片加载失败，请检查网络或CORS';
                console.error(e);
                fallbackLoadWithoutCors(imageList[0].url);
            }
        }

        function fallbackLoadWithoutCors(url) {
            const img = new Image();
            img.onload = () => {
                customImage = img;
                imageLoaded = true;
                tiles = generateShuffledTiles();
                winModalShown = false;
                drawPuzzle();
                statusMsg.textContent = '已加载（无CORS模式）';
                folderHint.textContent = '提示：无CORS模式可能导致部分功能受限';
            };
            img.onerror = () => {
                statusMsg.textContent = '图片确实无法加载，请检查URL';
            };
            img.src = url;
        }

        function testImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                const timer = setTimeout(() => {
                    img.onload = null;
                    img.onerror = null;
                    resolve(false);
                }, 4000);
                img.onload = () => { clearTimeout(timer); resolve(true); };
                img.onerror = () => { clearTimeout(timer); resolve(false); };
                img.src = url;
            });
        }

        // ---------- 下一张 ----------
        function loadNextImage() {
            if (imageList.length === 0) {
                statusMsg.textContent = '没有更多图片';
                return;
            }
            currentImageIndex = (currentImageIndex + 1) % imageList.length;
            const nextImg = imageList[currentImageIndex];
            const total = imageList.length;

            loadImageFromUrl(nextImg.url, `(${currentImageIndex + 1}/${total})`)
                .then(() => {
                    statusMsg.textContent = `已加载 ${currentImageIndex + 1}/${total}：${nextImg.name}`;
                    folderHint.textContent = `📁 ${total} 张图片 · 当前第${currentImageIndex + 1}张（${nextImg.name}）`;
                    hideWinModal();
                })
                .catch(() => {
                    statusMsg.textContent = '图片加载失败';
                });
        }

        function shuffleCurrentTiles() {
            if (!tiles.length) return;
            tiles = generateShuffledTiles();
            winModalShown = false;
            drawPuzzle();
            statusMsg.textContent = '拼图已打乱，拖动交换位置';
            statusMsg.classList.remove('win-effect');
            hideWinModal();
        }

        function checkSolved() {
            const solved = isSolvedArray(tiles);
            if (solved) {
                statusMsg.textContent = '🎉 恭喜！拼图完成！';
                statusMsg.classList.add('win-effect');
                drawPuzzle();
                if (!winModalShown) {
                    winModalShown = true;
                    if (imageList.length > 1) {
                        modalDesc.textContent = `你成功拼好了这幅拼图！还有 ${imageList.length - 1} 张图片等你挑战。`;
                        nextImageBtn.style.display = 'block';
                    } else if (imageList.length === 1) {
                        modalDesc.textContent = `你成功拼好了这幅拼图！这是当前唯一的图片。`;
                        nextImageBtn.style.display = 'none';
                    } else {
                        modalDesc.textContent = `你成功拼好了这幅拼图，太棒了！`;
                        nextImageBtn.style.display = 'none';
                    }
                    showWinModal();
                }
            }
            return solved;
        }

        function showWinModal() { winModal.classList.add('show'); }
        function hideWinModal() { winModal.classList.remove('show'); }

        // ============================================================
        //  坐标获取（鸿蒙优化：用 clientWidth 换算）
        // ============================================================
        function getCanvasCoords(e) {
            let clientX, clientY;

            if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = canvas.getBoundingClientRect();
            const cssW = canvas.clientWidth || rect.width;
            const cssH = canvas.clientHeight || rect.height;
            const scaleX = canvas.width / cssW;
            const scaleY = canvas.height / cssH;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
            };
        }

        // 严格判定
        function getTileIndexFromPoint(canvasX, canvasY) {
            if (canvasX < -2 || canvasX >= CANVAS_W + 2 ||
                canvasY < -2 || canvasY >= CANVAS_H + 2) {
                return -1;
            }
            const col = Math.max(0, Math.min(COLS - 1, Math.floor(canvasX / TILE_W)));
            const row = Math.max(0, Math.min(ROWS - 1, Math.floor(canvasY / TILE_H)));
            return row * COLS + col;
        }

        // 最近格子（鸿蒙宽松版）
        function getNearestTileIndex(canvasX, canvasY) {
            if (canvasX < -TILE_W / 2 || canvasX > CANVAS_W + TILE_W / 2 ||
                canvasY < -TILE_H / 2 || canvasY > CANVAS_H + TILE_H / 2) {
                return -1;
            }
            const col = Math.round(canvasX / TILE_W - 0.5);
            const row = Math.round(canvasY / TILE_H - 0.5);
            const c = Math.max(0, Math.min(COLS - 1, col));
            const r = Math.max(0, Math.min(ROWS - 1, row));
            return r * COLS + c;
        }

        // ---------- 绘制 ----------
        function drawPuzzle() {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE_W, 0);
                ctx.lineTo(i * TILE_W, CANVAS_H);
                ctx.strokeStyle = '#263b4e';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * TILE_H);
                ctx.lineTo(CANVAS_W, i * TILE_H);
                ctx.strokeStyle = '#263b4e';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            for (let pos = 0; pos < TILE_COUNT; pos++) {
                if (isDragging && dragMoved && pos === dragSourceIndex) continue;
                const tileValue = tiles[pos];
                const row = Math.floor(pos / COLS);
                const col = pos % COLS;
                const x = col * TILE_W;
                const y = row * TILE_H;

                if (imageLoaded && customImage) {
                    const srcRow = Math.floor(tileValue / COLS);
                    const srcCol = tileValue % COLS;
                    const srcX = srcCol * (customImage.width / COLS);
                    const srcY = srcRow * (customImage.height / ROWS);
                    const srcW = customImage.width / COLS;
                    const srcH = customImage.height / ROWS;
                    try {
                        ctx.drawImage(customImage, srcX, srcY, srcW, srcH, x, y, TILE_W, TILE_H);
                    } catch (e) {
                        const colorIndex = tileValue % DEFAULT_TILE_COLORS.length;
                        ctx.fillStyle = DEFAULT_TILE_COLORS[colorIndex];
                        ctx.fillRect(x, y, TILE_W, TILE_H);
                    }
                } else {
                    const colorIndex = tileValue % DEFAULT_TILE_COLORS.length;
                    ctx.fillStyle = DEFAULT_TILE_COLORS[colorIndex];
                    ctx.fillRect(x, y, TILE_W, TILE_H);
                    ctx.font = `bold ${TILE_W * 0.4}px 'Segoe UI', Roboto, sans-serif`;
                    ctx.fillStyle = '#ffffffdd';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#00000080';
                    ctx.shadowBlur = 6;
                    ctx.fillText(tileValue + 1, x + TILE_W / 2, y + TILE_H / 2);
                    ctx.shadowBlur = 0;
                }
                ctx.strokeStyle = '#ffffff30';
                ctx.lineWidth = 2.5;
                ctx.strokeRect(x + 1, y + 1, TILE_W - 2, TILE_H - 2);
            }

            if (isDragging && dragMoved && dragSourceIndex !== -1) {
                const tileValue = tiles[dragSourceIndex];
                const drawX = dragCurrentX - dragOffsetX;
                const drawY = dragCurrentY - dragOffsetY;

                ctx.save();
                ctx.globalAlpha = 0.9;
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 20;

                if (imageLoaded && customImage) {
                    const srcRow = Math.floor(tileValue / COLS);
                    const srcCol = tileValue % COLS;
                    const srcX = srcCol * (customImage.width / COLS);
                    const srcY = srcRow * (customImage.height / ROWS);
                    const srcW = customImage.width / COLS;
                    const srcH = customImage.height / ROWS;
                    try {
                        ctx.drawImage(customImage, srcX, srcY, srcW, srcH, drawX, drawY, TILE_W, TILE_H);
                    } catch (e) {
                        const colorIndex = tileValue % DEFAULT_TILE_COLORS.length;
                        ctx.fillStyle = DEFAULT_TILE_COLORS[colorIndex];
                        ctx.fillRect(drawX, drawY, TILE_W, TILE_H);
                    }
                } else {
                    const colorIndex = tileValue % DEFAULT_TILE_COLORS.length;
                    ctx.fillStyle = DEFAULT_TILE_COLORS[colorIndex];
                    ctx.fillRect(drawX, drawY, TILE_W, TILE_H);
                    ctx.font = `bold ${TILE_W * 0.4}px 'Segoe UI', Roboto, sans-serif`;
                    ctx.fillStyle = '#ffffffdd';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowBlur = 6;
                    ctx.fillText(tileValue + 1, drawX + TILE_W / 2, drawY + TILE_H / 2);
                }
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#f5e56b';
                ctx.lineWidth = 5;
                ctx.strokeRect(drawX + 3, drawY + 3, TILE_W - 6, TILE_H - 6);
                ctx.restore();
            }

            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#5f7f9f';
            ctx.lineWidth = 4;
            ctx.strokeRect(2, 2, CANVAS_W - 4, CANVAS_H - 4);
        }

        // ---------- 指针事件 ----------
        function onPointerDown(e) {
            e.preventDefault();
            if (isDragging) return;
            if (winModal.classList.contains('show')) return;

            const coords = getCanvasCoords(e);
            const tileIndex = getTileIndexFromPoint(coords.x, coords.y);
            if (tileIndex === -1) return;

            isDragging = true;
            dragSourceIndex = tileIndex;
            dragMoved = false;

            const row = Math.floor(tileIndex / COLS);
            const col = tileIndex % COLS;
            const tileX = col * TILE_W;
            const tileY = row * TILE_H;

            dragStartX = coords.x;
            dragStartY = coords.y;
            dragCurrentX = coords.x;
            dragCurrentY = coords.y;
            dragOffsetX = coords.x - tileX;
            dragOffsetY = coords.y - tileY;

            drawPuzzle();
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const coords = getCanvasCoords(e);
            dragCurrentX = coords.x;
            dragCurrentY = coords.y;

            const dx = coords.x - dragStartX;
            const dy = coords.y - dragStartY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (!dragMoved && distance > 3) {
                dragMoved = true;
                statusMsg.textContent = '拖动中...松开手指交换位置';
            }
            if (dragMoved) drawPuzzle();
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            e.preventDefault();

            const srcIdx = dragSourceIndex;
            const moved = dragMoved;

            let clientX, clientY;
            if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = canvas.getBoundingClientRect();
            const cssW = canvas.clientWidth || rect.width;
            const cssH = canvas.clientHeight || rect.height;
            const scaleX = canvas.width / cssW;
            const scaleY = canvas.height / cssH;

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            const dropIndex = getNearestTileIndex(canvasX, canvasY);

            if (moved && dropIndex !== -1 && srcIdx !== -1 && dropIndex !== srcIdx) {
                [tiles[srcIdx], tiles[dropIndex]] = [tiles[dropIndex], tiles[srcIdx]];
                statusMsg.textContent = `已交换：第${srcIdx + 1}块 ↔ 第${dropIndex + 1}块`;
                statusMsg.classList.remove('win-effect');
            } else if (!moved) {
                statusMsg.textContent = '请拖动拼图块到另一块上';
            } else if (dropIndex === srcIdx) {
                statusMsg.textContent = '松开位置还是同一块，未交换';
            } else {
                statusMsg.textContent = '松开位置无效';
            }

            isDragging = false;
            dragSourceIndex = -1;
            dragMoved = false;
            drawPuzzle();
            checkSolved();
        }

        function onPointerCancel(e) {
            if (!isDragging) return;
            e.preventDefault();
            isDragging = false;
            dragSourceIndex = -1;
            dragMoved = false;
            drawPuzzle();
            statusMsg.textContent = '拖动取消';
        }

        // ---------- 事件绑定 ----------
        function bindEvents() {
            canvas.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            canvas.addEventListener('touchstart', onPointerDown, { passive: false });
            canvas.addEventListener('touchmove', onPointerMove, { passive: false });
            canvas.addEventListener('touchend', onPointerUp, { passive: false });
            canvas.addEventListener('touchcancel', onPointerCancel, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (e.target === canvas) e.preventDefault();
            }, { passive: false });
            canvas.addEventListener('dblclick', (e) => e.preventDefault());
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            reloadBtn.addEventListener('click', () => scanRemoteImages());
            shuffleBtn.addEventListener('click', () => {
                if (!tiles.length) initDefaultTiles();
                else shuffleCurrentTiles();
            });

            modalCloseBtn.addEventListener('click', hideWinModal);
            nextImageBtn.addEventListener('click', () => {
                hideWinModal();
                loadNextImage();
            });
            winModal.addEventListener('click', (e) => {
                if (e.target === winModal) hideWinModal();
            });
        }

        function init() {
            initDefaultTiles();
            bindEvents();
            setTimeout(() => scanRemoteImages(), 200);
        }

        init();
    })();
</script>
</body>
</html>
